version: 2

sources:
  - name: rdl_omnia_commerce
    database: "{{ env_var('GCP_PROJECT_ID', 'bellosdata') }}"
    schema: rdl_omnia_commerce
    description: "VelvetLane & VelvetMens custom e-commerce platform staging tables backed by GCS JSONL.GZ"
    tables:
      - name: velvet_lane_customers_history
        description: "Raw VelvetLane customer records loaded from gs://omnistyle-rdl-staging/raw/velvet_lane/customers/"
      - name: velvet_lane_orders_history
        description: "Raw VelvetLane order records loaded from gs://omnistyle-rdl-staging/raw/velvet_lane/orders/"
      - name: velvet_lane_order_items_history
        description: "Raw VelvetLane order line items loaded from gs://omnistyle-rdl-staging/raw/velvet_lane/order_items/"
      - name: velvet_lane_products_history
        description: "Raw VelvetLane product catalogue loaded from gs://omnistyle-rdl-staging/raw/velvet_lane/products/"
      - name: velvet_mens_customers_history
        description: "Raw VelvetMens customer records"
      - name: velvet_mens_orders_history
        description: "Raw VelvetMens order records"
      - name: velvet_mens_order_items_history
        description: "Raw VelvetMens order line items"
      - name: velvet_mens_products_history
        description: "Raw VelvetMens product catalogue"

  - name: rdl_salesforce_commerce
    database: "{{ env_var('GCP_PROJECT_ID', 'bellosdata') }}"
    schema: rdl_salesforce_commerce
    description: "TrendPulse Salesforce Commerce Cloud (Demandware) staging tables"
    tables:
      - name: trend_pulse_customers_history
      - name: trend_pulse_orders_history
      - name: trend_pulse_order_items_history
      - name: trend_pulse_products_history

  - name: rdl_shopify
    database: "{{ env_var('GCP_PROJECT_ID', 'bellosdata') }}"
    schema: rdl_shopify
    description: "RebelChic Shopify Plus staging tables"
    tables:
      - name: rebel_chic_customers_history
      - name: rebel_chic_orders_history
      - name: rebel_chic_order_items_history
      - name: rebel_chic_products_history

  - name: rdl_magento
    database: "{{ env_var('GCP_PROJECT_ID', 'bellosdata') }}"
    schema: rdl_magento
    description: "AtelierLuxe & RivieraMode Adobe Commerce (Magento) staging tables"
    tables:
      - name: atelier_luxe_customers_history
      - name: atelier_luxe_orders_history
      - name: atelier_luxe_order_items_history
      - name: atelier_luxe_products_history
      - name: riviera_mode_customers_history
      - name: riviera_mode_orders_history
      - name: riviera_mode_order_items_history
      - name: riviera_mode_products_history

  - name: rdl_oracle_commerce
    database: "{{ env_var('GCP_PROJECT_ID', 'bellosdata') }}"
    schema: rdl_oracle_commerce
    description: "GrandHeritage Oracle ATG Commerce staging tables"
    tables:
      - name: grand_heritage_customers_history
      - name: grand_heritage_orders_history
      - name: grand_heritage_order_items_history
      - name: grand_heritage_products_history

  - name: rdl_marketing
    database: "{{ env_var('GCP_PROJECT_ID', 'bellosdata') }}"
    schema: rdl_marketing
    description: "Cross-brand performance marketing & web analytics staging tables"
    tables:
      - name: meta_ads_history
      - name: google_ads_history
      - name: tiktok_ads_history
      - name: ga4_sessions_history
      - name: email_campaigns_history
      - name: influencers_history
