    dataset: rdl_prettylittlething
    ecommerce: [customers, products, orders, order_items]
    marketing: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]

  # == NastyGal =================================================
  nastygal:
