# =================================================================
# GCS → BigQuery Load Job Configuration (Per-Brand RDL)
# Each brand has its own BigQuery dataset: rdl_{brand}
# GCS path: raw/{brand}/{source}/ingest_date={date}/{source}.jsonl.gz
# =================================================================

settings:
  bucket: omnistyle-rdl-staging-bellosdata
  project: ${GCP_PROJECT_ID}
  region: europe-west2

brands:

  # == VelvetLane ===================================================
  velvet_lane:
    dataset: rdl_velvet_lane
    ecommerce: [customers, products, orders, order_items]
    marketing: [meta_ads, google_ads, tiktok_ads, ga4_sessions, email_campaigns, influencer_posts]

  # == VelvetMens ===============================================
  velvet_mens:
