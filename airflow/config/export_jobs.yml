# =================================================================
# BigQuery → GCS Parquet Export Configuration
# Each model maps to a BigQuery EXPORT DATA statement.
# The DAG reads this file and submits each query to BigQuery.
# =================================================================

settings:
  project: ${GCP_PROJECT_ID}
  gcs_bucket: omnistyle-data-quality-bellosdata
  region: europe-west2

exports:

  # == RDL Layer — Cross-Cutting Sources =======================
  rdl_shared:
    models:
      - dataset: rdl_zendesk
        tables: [rdl_tickets, rdl_agents, rdl_teams, rdl_ticket_interactions]
        filter: ""

      - dataset: rdl_qualtrics
        tables: [rdl_blnx_survey, rdl_nps_visitview]
        filter: ""

      - dataset: rdl_manhattan
        tables: [rdl_warehouse_status, rdl_basket_items]
        filter: ""

      - dataset: rdl_metapack
        tables: [rdl_parcel_events, rdl_delivery_order, rdl_delivery_item, rdl_digital_refunds]
        filter: ""

  # == RDL Layer — Per-Brand ===================================
  rdl_brands:
    models:
      - dataset: rdl_velvet_lane
        tables: [customers_history, orders_history, products_history]
        filter: ""

      - dataset: rdl_velvet_mens
        tables: [customers_history, orders_history, products_history]
        filter: ""

      - dataset: rdl_trend_pulse
        tables: [customers_history, orders_history, products_history]
        filter: ""

      - dataset: rdl_rebel_chic
        tables: [customers_history, orders_history, products_history]
        filter: ""

      - dataset: rdl_atelier_luxe
        tables: [customers_history, orders_history, products_history]
        filter: ""

      - dataset: rdl_riviera_mode
        tables: [customers_history, orders_history, products_history]
        filter: ""

      - dataset: rdl_grand_heritage
        tables: [customers_history, orders_history, products_history]
        filter: ""

  # == ODL Layer ==================================================
  odl:
    models:
      - dataset: odl
        tables:
          - dim_tickets
          - dim_agents
          - dim_teams
          - fact_ticket_interactions
          - fact_ticket_blnx_survey
          - fact_nps_visitview
          - fact_basket_warehouse_status
          - fact_parcel_events
          - fact_customer_otif
          - fact_customer_otif_cc
          - fact_postship_defect
          - fact_digital_refunds
          - fact_delivery_order
          - fact_delivery_item
          - fact_basket_items

  # == ADL Layer ==================================================
  adl:
    models:
      - dataset: bi
        tables:
          - fact_cx_nps_summary
          - fact_delivery_performance
          - fact_ticket_resolution
