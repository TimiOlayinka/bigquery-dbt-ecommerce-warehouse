steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'jobs/']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/ecommerce_customers:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/ecommerce_orders:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/ecommerce_products:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_meta_ads:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_google_ads:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_tiktok_ads:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_ga4_sessions:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_email_campaigns:latest']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/omnistyle-base:latest', 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_influencers:latest']

images:
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/ecommerce_customers:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/ecommerce_orders:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/ecommerce_products:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_meta_ads:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_google_ads:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_tiktok_ads:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_ga4_sessions:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_email_campaigns:latest'
  - 'europe-west2-docker.pkg.dev/bellosdata/omnistyle-jobs/marketing_influencers:latest'

